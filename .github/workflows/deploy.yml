name: Deploy to GitHub Pages

# Builds the site on every push to main and publishes it to the gh-pages branch,
# which GitHub Pages serves (Settings → Pages → Source: Deploy from a branch → gh-pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Project site lives at https://brillbrainstechteam.github.io/dgtrainings/
          # When moving to the BrillBrains sub-domain: set SITE_URL to it and remove BASE_PATH.
          SITE_URL: https://brillbrainstechteam.github.io
          BASE_PATH: /dgtrainings
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
